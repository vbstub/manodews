<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星云编织者 | Nebula Weaver</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 动态背景渐变 */
        #bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
            z-index: 0;
            transition: background 2s ease;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: crosshair;
        }

        /* UI 覆盖层 */
        .overlay {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none; /* 让鼠标穿透文字操作画布 */
            user-select: none;
        }

        h1 {
            margin: 0;
            font-weight: 200;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        p {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.6;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border-radius: 20px;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>
    <canvas id="canvas"></canvas>

    <div class="overlay">
        <h1>Nebula Weaver</h1>
        <p>移动鼠标以编织星云 / 点击以此爆发 / 每一个瞬间都是唯一</p>
    </div>

    <div class="controls">
        <button onclick="clearCanvas()">清空画布</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let hue = 0; // 色相轮

        // 初始化画布尺寸
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // 鼠标位置追踪
        const mouse = {
            x: undefined,
            y: undefined
        }

        canvas.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
            // 移动时产生少量粒子
            for(let i=0; i<3; i++){
                particles.push(new Particle());
            }
        });

        canvas.addEventListener('click', function(event) {
            // 点击时产生爆炸效果
            for(let i=0; i<30; i++){
                particles.push(new Particle(true));
            }
        });

        canvas.addEventListener('mouseleave', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });

        // 粒子类
        class Particle {
            constructor(isExplosion = false) {
                this.x = mouse.x || Math.random() * width;
                this.y = mouse.y || Math.random() * height;
                
                // 爆炸模式速度更快
                const velocityMultiplier = isExplosion ? 6 : 2;
                this.speedX = (Math.random() * velocityMultiplier) - (velocityMultiplier/2);
                this.speedY = (Math.random() * velocityMultiplier) - (velocityMultiplier/2);
                
                this.size = Math.random() * 5 + 1;
                // 颜色基于当前的色相轮，产生彩虹渐变
                this.color = 'hsl(' + hue + ', 100%, 50%)';
                
                // 粒子生命周期，每帧减少尺寸
                this.shrinkRate = 0.05; 
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // 尺寸逐渐减小
                if (this.size > 0.2) this.size -= this.shrinkRate; 
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 连线逻辑
        function handleParticles() {
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                // 检查每一个粒子与其他粒子的距离
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    // 如果距离足够近，画线连接
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = particles[i].color;
                        // 线的透明度基于距离，越远越淡
                        ctx.lineWidth = particles[i].size / 3;
                        ctx.globalAlpha = 1 - (distance / 100); 
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1; // 重置透明度
                    }
                }

                // 如果粒子太小，移除它
                if (particles[i].size <= 0.3) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }

        // 清空功能
        window.clearCanvas = function() {
            particles = [];
            ctx.clearRect(0, 0, width, height);
        }

        // 动画循环
        function animate() {
            // 产生拖尾效果的关键：不完全清除画布，而是覆盖一层半透明黑色
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; 
            ctx.fillRect(0, 0, width, height);
            
            handleParticles();
            
            // 缓慢旋转色相，产生颜色流动
            hue += 2; 
            
            requestAnimationFrame(animate);
        }

        // 自动添加一些初始粒子作为演示
        for(let i=0; i<10; i++) {
             mouse.x = width/2;
             mouse.y = height/2;
             particles.push(new Particle(true));
        }
        mouse.x = undefined; // 重置鼠标位置以免粘连

        animate();

    </script>
</body>
</html>
